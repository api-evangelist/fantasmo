name: Fantasmo
description: Fantasmo builds CPS (Camera Positioning System), a computer-vision positioning technology it
  positions as a "camera-powered GPS replacement" delivering hyper-accurate localization that works indoors
  and in dense urban environments where satellite GPS degrades, using only a device camera and a data
  connection rather than additional infrastructure. Its target applications span micromobility (scooter/bike
  tracking and theft prevention), robotics navigation, mobile augmented-reality experiences, and automotive
  lane-level positioning. Fantasmo was a Techstars-backed startup and was acquired by Niantic in 2022; the
  public fantasmo.io site remains online but exposes no developer portal, API reference, SDK, or OpenAPI
  surface at this time. This profile was enriched from the provider's public web presence and live
  DNS/TLS/HTTP probes.
